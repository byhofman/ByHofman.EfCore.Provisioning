name: Dependency submission

on:
  push:
    branches: [main, chore/nuget-dependency-submission]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore ByHofman.EfCore.Provisioning.slnx --locked-mode

      - uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
        with:
          detectorsCategories: NuGet
          fail-on-empty: 'true'
